name: Update bookshelf from Goodreads

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/goodreads.yml"
      - "scripts/fetch_goodreads.py"

permissions:
  contents: write

concurrency:
  group: goodreads-${{ github.ref }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Goodreads shelves
        env:
          GOODREADS_KEY: ${{ secrets.GOODREADS_KEY }} # optional; only needed if the profile isn't public
        run: python3 scripts/fetch_goodreads.py 206355505 data/books.json

      - name: Commit if the books changed
        run: |
          if git diff --quiet -- data/books.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json
          git commit -m "Update bookshelf from Goodreads"
          git push
