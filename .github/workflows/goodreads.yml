name: Update bookshelf from Goodreads

# Manual only: the bookshelf is updated on request, not on a schedule.
# Run from the Actions tab ("Run workflow") or: gh workflow run goodreads.yml
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-sync-${{ github.ref }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Goodreads shelves
        run: python3 scripts/fetch_goodreads.py 206355505 data/books.json

      - name: Commit if the books changed
        run: |
          if git diff --quiet -- data/books.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/books.json
          git commit -m "Update bookshelf from Goodreads"
          git pull --rebase
          git push
