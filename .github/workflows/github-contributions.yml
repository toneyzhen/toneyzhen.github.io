name: Update GitHub contributions

on:
  schedule:
    - cron: "23 10 * * *" # daily, 10:23 UTC
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/github-contributions.yml"
      - "scripts/fetch_github.py"

permissions:
  contents: write

concurrency:
  group: data-sync-${{ github.ref }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution calendar
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_github.py data/github.json

      - name: Commit if the data changed
        run: |
          git add data/github.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GitHub contributions"
          git pull --rebase
          git push
